<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | The Cris Records</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      animation: slideIn 1s ease forwards;
    }

    @keyframes slideIn {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    header h1 {
      font-size: 32px;
      margin: 0;
      font-weight: 800;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px;
      text-align: center;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 40px;
    }

    .btn {
      padding: 15px 30px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #ff4d4d, #ff8c00);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(255,140,0,0.4);
    }

    .free-text {
      margin-top: 50px;
      font-size: 20px;
      font-weight: 600;
    }

    .discord-btn {
      margin-top: 20px;
      background: linear-gradient(135deg, #5865F2, #404EED);
    }

    /* CONTACTO */
    .contact-section {
      margin-top: 100px;
      padding: 40px 20px;
      border-top: 1px solid rgba(255,255,255,0.15);
      text-align: center;
      color: #ccc;
    }

    .contact-section h2 {
      color: white;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .contact-section a {
      color: #4da3ff;
      text-decoration: none;
    }

    .contact-section a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Bienvenido a The Cris Records</h1>
</header>

<div class="container">

  <div class="buttons">
    <button class="btn" onclick="location.href='distribution'">
      🎵 Distribuir música
    </button>

    <button class="btn" onclick="location.href='artists'">
      🎤 Artistas
    </button>

    <button class="btn" onclick="logout()">
      🚪 Cerrar sesión
    </button>
  </div>

  <div class="free-text">
    ¡Todo es gratis! Bienvenido eres.
  </div>

  <button class="btn discord-btn" onclick="location.href='https://discord.gg/Fze6w3TwEv'">
    💬 Servidor de Discord
  </button>

</div>

<section class="contact-section">
  <h2>Contacto / Contact</h2>

  <p>
    <strong>Discord:</strong>
    thecrisrecords / holasoycris_m
  </p>

  <p>
    <strong>Email:</strong>
    <a href="mailto:thecrisrecords@gmail.com">
      thecrisrecords@gmail.com
    </a>
  </p>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBxBG3pfjle1xXYcHuozHs0CgRd-uDwxLo",
    authDomain: "thecrisrecords1.firebaseapp.com",
    projectId: "thecrisrecords1",
    appId: "1:1050112675638:web:a7da5497827fd94dba6d97"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.href = "index";
    }
  });

  window.logout = function () {
    signOut(auth).then(() => {
      window.location.href = "index";
    });
  };
</script>

</body>
</html>
